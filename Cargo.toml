[package]
name = "apify"
description = "Apify SDK for Rust: run crawlee-rs crawlers as Actors on the Apify platform."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/apify-projects/apify-sdk-rs"
authors = ["Apify Technologies s.r.o."]
publish = false

[dependencies]
# Pinned revisions: neither crate is released in the versions this SDK needs.
crawlee = { git = "https://github.com/apify-projects/crawlee-rs", rev = "1856d45" }
# The client's own transport (reqwest 0.12) is compiled without TLS and not used: requests go through
# `client::ReqwestBackend` on the reqwest version crawlee-rs uses.
apify-client = { git = "https://github.com/apify/apify-client-rust", rev = "8a4d19753448bbe0c443cfba04824dfcba4be252", default-features = false }

aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
aws-lc-rs = "1"
base64 = "0.22"
bytes = "1"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
des = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
indexmap = "2"
lru = "0.16"
md-5 = "0.10"
parking_lot = "0.12"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tower-http = { version = "0.6", features = ["decompression-br", "decompression-gzip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
