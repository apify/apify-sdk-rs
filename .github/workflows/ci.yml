name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: templates/actor
      # Against this checkout of the SDK instead of the git dependency.
      - run: >-
          cargo clippy --manifest-path templates/actor/Cargo.toml
          --config 'patch."https://github.com/apify-projects/apify-sdk-rs".apify.path="."'

  # The golden files still match what the JS SDK (at the pinned commit) does.
  conformance:
    runs-on: ubuntu-latest
    env:
      APIFY_SDK_JS_REV: fbcdc9c2742f61cd45eb56ad504337b4ce3e6695
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          git clone https://github.com/apify/apify-sdk-js ../apify-sdk-js
          cd ../apify-sdk-js && git checkout "$APIFY_SDK_JS_REV"
          corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm compile
      - run: APIFY_SDK_JS_DIR=../apify-sdk-js node --no-warnings conformance/oracle/generate-golden.mts
      - run: git diff --exit-code conformance/golden

  # Against the real API, with the APIFY_TOKEN secret (the tests skip without it).
  live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test live -- --nocapture

  # Builds and runs the template as an Actor on the platform; minutes long, so on demand only.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test e2e -- --nocapture
