[package]
name = "crawlee-rs-actor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
apify = { git = "https://github.com/apify/apify-sdk-rs", branch = "single-threaded" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
